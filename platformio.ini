; Farm-to-Mandi Journey Logger
;
; Two firmwares out of one tree:
;   remote - the box that rides in the truck (GPS, DHT22, MPU6050, SD, RFID)
;   base   - the farmer's node at the farm (OLED + radio receiver)
;
; SIM_BUILD=1 swaps two things and nothing else: the GPS becomes a loopback NMEA
; generator (Wokwi has no GPS part) and the LoRa radio becomes framed lines on
; UART0 (Wokwi has no LoRa part). Set SIM_BUILD=0 and TIME_SCALE=1.0f for field
; hardware.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:remote]
build_src_filter = -<*> +<shared/> +<remote/>
build_flags =
    -DSIM_BUILD=1
    -DTIME_SCALE=60.0f     ; 6 h journey plays out in ~6 min; set to 1.0f in the field
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/DHT sensor library
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    miguelbalboa/MFRC522@^1.4.11
    sandeepmistry/LoRa

[env:base]
build_src_filter = -<*> +<shared/> +<base/>
build_flags =
    -DSIM_BUILD=1
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit Unified Sensor
    sandeepmistry/LoRa
