name: 'Base node - replay a journey'
version: 1
author: 'Prasanna'

# Replays the frames captured from a real remote-node run straight into the base
# node's serial input, which is exactly what tools/lora_bridge.py does live. Use
# this to check the OLED rendering without having to run both simulations.

steps:
  - wait-serial: 'BASE: listening'
  - delay: 500ms

  - write-serial: "LORA>CJL,1,1,J,TOMATO,25.0,85,95,2.0\n"
  - delay: 700ms

  - write-serial: "LORA>CJL,1,2,C,FARM,01:02:03:04,13.13657,78.12391,90\n"
  - delay: 700ms

  - write-serial: "LORA>CJL,1,3,H,TOMATO,18.0,90.0,0.00,OK,13.13657,78.12391,122\n"
  - delay: 700ms

  # The excursion that matters: too hot for tomatoes, on the Kolar stretch.
  - write-serial: "LORA>CJL,1,4,A,TOMATO,TEMP,31.00,25.00,13.13743,78.11629,243\n"
  - delay: 900ms

  - write-serial: "LORA>CJL,1,5,C,COLLECTION,11:22:33:44,13.13800,78.11120,364\n"
  - delay: 700ms

  - write-serial: "LORA>CJL,1,6,A,TOMATO,SHOCK,3.00,2.00,13.13857,78.10612,486\n"
  - delay: 900ms

  - write-serial: "LORA>CJL,1,7,C,MANDI,55:66:77:88,13.13943,78.09849,667\n"
  - delay: 700ms

  - write-serial: "LORA>CJL,1,8,S,TOMATO,31.0,18.0,90.0,90.0,3.00,2,722,C-POOR\n"
  - delay: 1200ms
